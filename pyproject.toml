[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tac"
version = "0.0.1"
description = "Minimal differentiable XPBD physics engine / state estimator (gnoci)"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "flax",
]

[project.optional-dependencies]
viz = ["pyvista", "numpy<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mujoco>=3.17.0",
    "pytest>=9.2.0",
]
